<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Python Practice</title>
<link rel="icon" type="image/png" href="/snake.png">
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header>

        <div>
            <h1>🐍 Python Practice</h1>

            <p>
                Choose any Python file from my repository
                and run it.
            </p>
        </div>

        <a
            class="github"
            href="https://github.com/nytharshi/Python-Practice"
            target="_blank"
        >
            🐙 GitHub
        </a>

    </header>


    <main>

        <select id="fileSelect">

            <option value="">
                Choose a Python program
            </option>

        </select>


        <h2>Code</h2>

        <pre id="code">
Select a Python program.
        </pre>


        <h2>Input</h2>

        <div id="input"></div>


        <button id="run">
            ▶ Run Code
        </button>


        <h2>Output</h2>

        <pre id="output">
Output will appear here.
        </pre>

    </main>


    <script src="script.js"></script>

</body>

</html>
